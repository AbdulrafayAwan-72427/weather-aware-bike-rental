[project]
name = "seoul-bike-demand"
version = "0.1.0"
description = "Weather-aware prediction of hourly Seoul bike-sharing rentals (regression, chronological evaluation)"
readme = "README.md"
authors = [
    { name = "AbdulrafayAwan-72427", email = "abdur.rafay7373@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
